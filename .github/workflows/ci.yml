name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4.0"

      - name: Run Ruff Linter
        run: |
          ruff check .

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline unit tests
        run: |
          python -m pytest

  docker-build:
    name: Docker Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dockerfile: Dockerfile
            tag: linux
          - os: windows-latest
            dockerfile: Dockerfile.windows
            tag: windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v3

      - name: Check Docker version
        run: docker version

      - name: Build Docker image
        run: docker build -f ${{ matrix.dockerfile }} -t surgical-ai-agents:${{ matrix.tag }} .

      - name: Verify container execution (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: docker run --rm surgical-ai-agents:linux rehearse

      - name: Verify container execution (Windows)
        if: matrix.os == 'windows-latest'
        run: docker run --rm surgical-ai-agents:windows python -m app.cli rehearse
